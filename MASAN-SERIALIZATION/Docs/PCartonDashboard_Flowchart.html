        body {

            background: #1a1a2e;
            color: #eee;
            padding: 30px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container { max-width: 1300px; width: 100%; }
        h1 { text-align: center; color: #00d4ff; margin-bottom: 5px; font-size: 1.4em; }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.85em; }

        }
        .legend-item { display: flex; align-items: center; gap: 7px; font-size: 0.8em; }
        .legend-color { width: 14px; height: 14px; border-radius: 3px; }
        svg {
            display: block; margin: 0 auto;
            background: #16213e; border-radius: 14px;
            padding: 25px; box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        .t { font-size: 12px; fill: #fff; }
        .c { font-size: 10px; fill: #aaa; font-style: italic; }
        .zone { stroke-width: 2; stroke-dasharray: 6 4; fill-opacity: 0.05; }
        .zt { font-size: 11px; fill: #888; }
        .a { stroke: #00d4ff; fill: none; stroke-width: 2; }
        .ah { stroke: #ff6b6b; }
        .as { stroke: #ffd93d; }
        .am { stroke: #ff9f43; }
        .a-head { fill: #00d4ff; }
        .a-head-h { fill: #ff6b6b; }
        .a-head-s { fill: #ffd93d; }
        .a-head-m { fill: #ff9f43; }

</head>
