<html lang="vi">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {

            display: block;
            margin: 0 auto;
        }

        .node-title {
            font-size: 13px;
            font-weight: bold;
            fill: #fff;
        }
        .node-text {
            font-size: 11px;
            fill: #ddd;
        }
        .node-text-small {
            font-size: 10px;
            fill: #bbb;
        }
        .node-comment {
            font-size: 10px;
            fill: #aaa;
            font-style: italic;
        }
        /* Arrow markers */
        .arrow-head { fill: #00d4ff; }
        .arrow-head-hid { fill: #ff6b6b; }
        .arrow-head-serial { fill: #ffd93d; }
        .arrow-head-tcp { fill: #6bcb77; }
        .arrow-head-http { fill: #c9b1ff; }
        .arrow-head-merge { fill: #ff9f43; }
        .arrow { stroke: #00d4ff; fill: none; stroke-width: 1.5; }
        .arrow-hid { stroke: #ff6b6b; }
        .arrow-serial { stroke: #ffd93d; }
        .arrow-tcp { stroke: #6bcb77; }
        .arrow-http { stroke: #c9b1ff; }
        .arrow-merge { stroke: #ff9f43; }

        .zone { stroke-width: 2; stroke-dasharray: 6 4; fill-opacity: 0.06; }
        .zone-title { font-size: 11px; fill: #888; }
    </style>
</head>
<body>

<h1>Sơ đồ Giải thuật — Máy Quét Thùng (PCartonDashboard)</h1>
<p class="subtitle">3 nguồn input: HID Bluetooth (Raw Input), Serial Port, TCP/IP + HTTP Server &rarr; HandScan01/02 Process &rarr; Kết quả</p>

<div class="legend">
    <div class="legend-item"><div class="legend-color" style="background:#ff6b6b"></div> HID Bluetooth</div>
    <div class="legend-item"><div class="legend-color" style="background:#ffd93d"></div> Serial Port</div>
    <div class="legend-item"><div class="legend-color" style="background:#6bcb77"></div> TCP/IP</div>
    <div class="legend-item"><div class="legend-color" style="background:#c9b1ff"></div> HTTP Server</div>
    <div class="legend-item"><div class="legend-color" style="background:#ff9f43"></div> Merge / Xử lý chung</div>
    <div class="legend-item"><div class="legend-color" style="background:#00d4ff"></div> Luồng chung</div>
</div>

<div class="svg-container">
<svg width="1400" height="3100" xmlns="http://www.w3.org/2000/svg">

  <!-- ==================== ZONE: INIT ==================== -->
  <rect class="zone" x="480" y="10" width="400" height="90" stroke="#00d4ff" fill="#00d4ff"/>
  <text class="zone-title" x="490" y="26" fill="#00d4ff">INIT (PCartonDashboard.INIT)</text>

  <!-- INIT Start -->
  <ellipse cx="680" cy="55" rx="70" ry="22" fill="#0d1b2a" stroke="#00d4ff" stroke-width="2"/>
  <text class="node-text" x="680" y="60" text-anchor="middle" fill="#00d4ff">START</text>

  <line x1="680" y1="77" x2="680" y2="105" class="arrow" marker-end="url(#arrowHead)"/>

  <!-- Register Raw Input -->
  <rect x="560" y="105" width="240" height="44" rx="6" fill="#0d1b2a" stroke="#ff6b6b" stroke-width="2"/>
  <text class="node-text" x="680" y="120" text-anchor="middle">RegisterKeyboardRawInput()</text>
  <text class="node-comment" x="680" y="136" text-anchor="middle">usUsagePage=0x01, usUsage=0x06, RIDEV_INPUTSINK</text>

  <line x1="680" y1="149" x2="680" y2="175" class="arrow" marker-end="url(#arrowHead)"/>

  <!-- Check cartonScanerMode -->
  <polygon points="680,175 780,220 680,265 580,220" fill="#0d1b2a" stroke="#00d4ff" stroke-width="2"/>
  <text class="node-text" x="680" y="215" text-anchor="middle" fill="#00d4ff">cartonScanerMode == 1 ?</text>
  <text class="node-comment" x="680" y="230" text-anchor="middle" font-size="9">Mode TCP/IP ?</text>

  <!-- NO: Serial -->
  <line x1="580" y1="220" x2="480" y2="220" class="arrow" marker-end="url(#arrowHeadHID)"/>
  <text x="450" y="215" class="node-text" fill="#ff6b6b">NO</text>

  <!-- YES: TCP -->
  <line x1="780" y1="220" x2="880" y2="220" class="arrow arrow-tcp" marker-end="url(#arrowHeadTCP)"/>
  <text x="850" y="215" class="node-text" fill="#6bcb77">YES</text>

  <!-- TCP Connect -->
  <rect x="880" y="190" width="210" height="60" rx="6" fill="#0d1b2a" stroke="#6bcb77" stroke-width="2"/>
  <text class="node-text" x="985" y="213" text-anchor="middle">tcpClient1.Connect()</text>
  <text class="node-text" x="985" y="229" text-anchor="middle">TCP IP: <tspan fill="#6bcb77">cartonScanerTCP_IP</tspan></text>
  <text class="node-text" x="985" y="243" text-anchor="middle">Port: <tspan fill="#6bcb77">cartonScanerTCP_Port</tspan></text>

  <!-- Serial init -->
  <rect x="280" y="190" width="200" height="60" rx="6" fill="#0d1b2a" stroke="#ffd93d" stroke-width="2"/>
  <text class="node-text" x="380" y="210" text-anchor="middle">_ScanConection01.LOAD()</text>
  <text class="node-text" x="380" y="226" text-anchor="middle">_ScanConection01.CONNECT()</text>
  <text class="node-text" x="380" y="242" text-anchor="middle">COM: <tspan fill="#ffd93d">HandScanCOM01</tspan></text>

  <line x1="380" y1="250" x2="380" y2="280" class="arrow arrow-serial" marker-end="url(#arrowHeadSerial)"/>

  <!-- Serial init 2 -->
  <rect x="280" y="280" width="200" height="60" rx="6" fill="#0d1b2a" stroke="#ffd93d" stroke-width="2"/>
  <text class="node-text" x="380" y="300" text-anchor="middle">_ScanConection02.LOAD()</text>
  <text class="node-text" x="380" y="316" text-anchor="middle">_ScanConection02.CONNECT()</text>
  <text class="node-text" x="380" y="332" text-anchor="middle">COM: <tspan fill="#ffd93d">HandScanCOM02</tspan></text>

  <!-- HTTP Server + Background Workers -->
  <line x1="985" y1="250" x2="985" y2="275" class="arrow arrow-tcp" marker-end="url(#arrowHeadTCP)"/>
  <line x1="380" y1="340" x2="380" y2="365" class="arrow arrow-serial" marker-end="url(#arrowHeadSerial)"/>

  <rect x="855" y="275" width="260" height="90" rx="6" fill="#0d1b2a" stroke="#6bcb77" stroke-width="2"/>
  <text class="node-text" x="985" y="295" text-anchor="middle">HttpListener.Start()</text>
  <text class="node-comment" x="985" y="312" text-anchor="middle">http://+:<tspan fill="#6bcb77">9999</tspan></text>
  <text class="node-comment" x="985" y="328" text-anchor="middle">_bw_http_server.RunWorkerAsync()</text>
  <text class="node-comment" x="985" y="344" text-anchor="middle">_bw_update_ui.RunWorkerAsync()</text>

  <line x1="680" y1="265" x2="985" y2="320" class="arrow arrow-merge" stroke-dasharray="5,3" marker-end="url(#arrowHeadMerge)"/>
  <line x1="480" y1="250" x2="855" y2="320" class="arrow arrow-merge" stroke-dasharray="5,3" marker-end="url(#arrowHeadMerge)"/>
  <line x1="680" y1="265" x2="380" y2="365" class="arrow arrow-merge" stroke-dasharray="5,3"/>

  <!-- Merged start -->
  <ellipse cx="680" cy="380" rx="70" ry="22" fill="#0d1b2a" stroke="#00d4ff" stroke-width="2"/>
  <text class="node-text" x="680" y="385" text-anchor="middle" fill="#00d4ff">3 Nguồn Input</text>

  <!-- ===== HID PATH ===== -->
  <!-- ==================== ZONE: HID ==================== -->
  <rect class="zone" x="10" y="410" width="460" height="900" stroke="#ff6b6b" fill="#ff6b6b"/>
  <text class="zone-title" x="20" y="428" fill="#ff6b6b">HID BLUETOOTH — Raw Input (WndProc)</text>

  <!-- HID 1: WndProc WM_INPUT -->
  <rect x="60" y="450" width="360" height="44" rx="6" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>
  <text class="node-text" x="240" y="476" text-anchor="middle">WndProc(WM_INPUT: 0x00FF)</text>
  <text class="node-comment" x="240" y="490" text-anchor="middle">HID gửi keyboard event dù form không focus</text>

  <line x1="240" y1="494" x2="240" y2="520" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>

  <!-- ProcessRawInput -->
  <rect x="60" y="520" width="360" height="44" rx="6" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>
  <text class="node-text" x="240" y="540" text-anchor="middle">ProcessRawInput(hRawInput)</text>
  <text class="node-comment" x="240" y="555" text-anchor="middle">GetRawInputData → Parse RAWINPUT</text>

  <line x1="240" y1="564" x2="240" y2="590" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>

  <!-- Diamond: dwType == RIM_TYPEKEYBOARD? -->
  <polygon points="240,590 340,635 240,680 140,635" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>
  <text class="node-text" x="240" y="628" text-anchor="middle" fill="#ff6b6b">dwType ==</text>
  <text class="node-text" x="240" y="642" text-anchor="middle" fill="#ff6b6b">RIM_TYPEKEYBOARD ?</text>

  <!-- No: skip -->
  <line x1="140" y1="635" x2="60" y2="635" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>
  <text x="80" y="630" class="node-text" fill="#ff6b6b">NO</text>
  <text x="40" y="645" class="node-comment">(skip)</text>

  <!-- Yes -->
  <line x1="240" y1="680" x2="240" y2="710" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>
  <text x="255" y="700" class="node-text" fill="#ff6b6b">YES</text>

  <!-- Diamond: KeyDown? -->
  <polygon points="240,710 340,755 240,800 140,755" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>
  <text class="node-text" x="240" y="748" text-anchor="middle" fill="#ff6b6b">KeyDown ?</text>
  <text class="node-comment" x="240" y="762" text-anchor="middle">msg == 0x0100 || 0x0104</text>

  <!-- No: skip -->
  <line x1="140" y1="755" x2="60" y2="755" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>
  <text x="80" y="750" class="node-text" fill="#ff6b6b">NO</text>
  <text x="40" y="765" class="node-comment">(skip)</text>

  <!-- Yes -->
  <line x1="240" y1="800" x2="240" y2="830" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>
  <text x="255" y="820" class="node-text" fill="#ff6b6b">YES</text>

  <!-- GetDeviceLane -->
  <rect x="60" y="830" width="360" height="44" rx="6" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>
  <text class="node-text" x="240" y="850" text-anchor="middle">GetDeviceLane(deviceHandle)</text>
  <text class="node-comment" x="240" y="864" text-anchor="middle">Xác định thiết bị → Lane 01 hoặc Lane 02</text>

  <line x1="240" y1="874" x2="240" y2="900" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>

  <!-- Diamond: Lane valid? -->
  <polygon points="240,900 340,945 240,990 140,945" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>
  <text class="node-text" x="240" y="938" text-anchor="middle" fill="#ff6b6b">Lane == 1 || 2 ?</text>

  <!-- No: skip -->
  <line x1="140" y1="945" x2="60" y2="945" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>
  <text x="80" y="940" class="node-text" fill="#ff6b6b">NO</text>
  <text x="40" y="955" class="node-comment">(skip)</text>

  <!-- Yes -->
  <line x1="240" y1="990" x2="240" y2="1020" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>
  <text x="255" y="1010" class="node-text" fill="#ff6b6b">YES</text>

  <!-- Diamond: Enter? -->
  <polygon points="240,1020 340,1065 240,1110 140,1065" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>

  <text class="node-text" x="240" y="1072" text-anchor="middle" fill="#ff6b6b">Enter ?</text>

  <line x1="340" y1="1065" x2="420" y2="1065" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>
  <text x="355" y="1060" class="node-text" fill="#ff6b6b">YES</text>

  <rect x="420" y="1035" width="280" height="60" rx="6" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>

  <text class="node-comment" x="560" y="1072" text-anchor="middle">Gom buffer → HandScan0<tspan fill="#ff6b6b">N</tspan>_Process(code)</text>

  <!-- NO: Add to buffer -->
  <line x1="240" y1="1110" x2="240" y2="1135" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>
  <text x="255" y="1128" class="node-text" fill="#ff6b6b">NO</text>

  <rect x="60" y="1135" width="360" height="44" rx="6" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>
  <text class="node-text" x="240" y="1155" text-anchor="middle">AddDataToLane0<tspan fill="#ff6b6b">N</tspan>(value)</text>
  <text class="node-comment" x="240" y="1170" text-anchor="middle">Append char → Reset Timer (200ms)</text>

  <!-- Timer branch -->
  <line x1="240" y1="1179" x2="240" y2="1205" class="arrow arrow-hid" marker-end="url(#arrowHeadHID)"/>

  <rect x="60" y="1205" width="360" height="44" rx="6" fill="#1a0a0a" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text class="node-text" x="240" y="1220" text-anchor="middle">SCAN_TIMEOUT_MS = 200ms</text>
  <text class="node-comment" x="240" y="1235" text-anchor="middle">Nếu handheld không gửi Enter</text>

  <line x1="240" y1="1249" x2="240" y2="1275" class="arrow arrow-hid" stroke-dasharray="4 2" marker-end="url(#arrowHeadHID)"/>

  <rect x="60" y="1275" width="360" height="44" rx="6" fill="#1a0a0a" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text class="node-text" x="240" y="1295" text-anchor="middle">Lane0<tspan fill="#ff6b6b">N</tspan>ScanCompleted()</text>
  <text class="node-comment" x="240" y="1310" text-anchor="middle">Timer callback → CompleteLane0<tspan fill="#ff6b6b">N</tspan>()</text>

  <text class="node-text" x="700" y="596" text-anchor="middle" fill="#ffd93d">Only_Once ?</text>

  <!-- YES: OnlyOnce branch -->

  <text x="815" y="585" class="node-text" fill="#ffd93d">YES</text>

  <rect x="880" y="555" width="260" height="70" rx="6" fill="#0d1b2a" stroke="#ffd93d" stroke-width="2"/>
  <text class="node-text" x="1010" y="577" text-anchor="middle">Kiểm tra prefix</text>
  <text class="node-comment" x="1010" y="593" text-anchor="middle">s chứa cartonCode_Line01 → Lane01</text>
  <text class="node-comment" x="1010" y="609" text-anchor="middle">s chứa cartonCode_Line02 → Lane02</text>

  <!-- NO: Direct process -->
  <line x1="700" y1="635" x2="700" y2="665" class="arrow arrow-serial" marker-end="url(#arrowHeadSerial)"/>
  <text x="715" y="655" class="node-text" fill="#ffd93d">NO</text>

  <rect x="560" y="665" width="280" height="44" rx="6" fill="#0d1b2a" stroke="#ffd93d" stroke-width="2"/>
  <text class="node-text" x="700" y="690" text-anchor="middle">HandScan01_Process(s)</text>
  <text class="node-comment" x="700" y="704" text-anchor="middle">→ Kết hợp luồng xử lý chung</text>

  <!-- Serial Lane 02 -->
  <line x1="880" y1="590" x2="880" y2="780" class="arrow arrow-serial"/>
  <line x1="880" y1="780" x2="700" y2="780" class="arrow arrow-serial" marker-end="url(#arrowHeadSerial)"/>

  <rect x="560" y="755" width="280" height="70" rx="6" fill="#0d1b2a" stroke="#ffd93d" stroke-width="2"/>

  <text class="node-comment" x="700" y="811" text-anchor="middle">s = chuỗi serial từ COM HandScanCOM02</text>

  <line x1="700" y1="825" x2="700" y2="855" class="arrow arrow-serial" marker-end="url(#arrowHeadSerial)"/>

  <rect x="560" y="855" width="280" height="44" rx="6" fill="#0d1b2a" stroke="#ffd93d" stroke-width="2"/>
  <text class="node-text" x="700" y="880" text-anchor="middle">HandScan02_Process(s)</text>
  <text class="node-comment" x="700" y="894" text-anchor="middle">→ Kết hợp luồng xử lý chung</text>

  <!-- ===== TCP PATH ===== -->

  <rect class="zone" x="930" y="410" width="460" height="280" stroke="#6bcb77" fill="#6bcb77"/>
  <text class="zone-title" x="940" y="428" fill="#6bcb77">TCP/IP</text>

  <text class="node-comment" x="1160" y="506" text-anchor="middle">data format: <tspan fill="#6bcb77">&lt;SC0/SC1&gt;&lt;p&gt;&lt;code&gt;</tspan></text>

  <text class="node-text" x="1160" y="652" text-anchor="middle" fill="#6bcb77">lane == "SC1" ?</text>

  <text class="node-comment" x="1420" y="670" text-anchor="middle">→ Kết hợp luồng xử lý chung</text>

  <text x="1175" y="725" class="node-text" fill="#6bcb77">NO</text>
